[package]
name = "harvey-mie"
version = "0.1.0"
edition = "2021"
description = "Windows window that edits the Pin element in one MIE trailer. It does not open an arbitrary MIE document."
license = "Artistic-1.0-Perl OR GPL-3.0-only"
repository = "https://github.com/elandrydenhall/harvey-mie"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
mie = { path = "../MIE" }
serde_json = "1.0.154"
